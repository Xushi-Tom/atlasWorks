  # 服务名：发布服务，负责发布记录、静态发布资源、WMTS 等访问
  atlasworks-publisher:
    image: ${ATLASWORKS_IMAGE:-atlasworks:release-20260506}
    platform: linux/amd64
    container_name: atlasworks-publisher
    restart: unless-stopped
    # 发布服务 CPU 上限
    cpus: ${ATLASWORKS_PUBLISHER_CPUS:-2.0}
    # 发布服务最大内存
    mem_limit: ${ATLASWORKS_PUBLISHER_MEM_LIMIT:-4g}
    depends_on:
      atlasworks-api:
        condition: service_healthy
    environment:
      # 容器时区
      - TZ=Asia/Shanghai
      # 固定为发布服务角色
      - ATLASWORKS_ROLE=publisher
      # 发布服务监听地址，容器内固定监听所有网卡
