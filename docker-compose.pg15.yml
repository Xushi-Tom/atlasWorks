      # 发布服务容器内部监听端口
      - PORT=18001
      # 发布访问地址完整覆盖；为空时按主机、端口和请求信息自动计算
      - ATLASWORKS_PUBLIC_BASE_URL=${ATLASWORKS_PUBLISHER_PUBLIC_BASE_URL:-}
      # 生成发布访问地址时使用的主机 IP 或域名
      - ATLASWORKS_PUBLIC_BASE_HOST=${ATLASWORKS_PUBLIC_BASE_HOST:-localhost}
      # 发布访问地址解析模式，request_host 表示优先使用请求 Host
      - ATLASWORKS_PUBLIC_BASE_MODE=${ATLASWORKS_PUBLIC_BASE_MODE:-request_host}
      # 生成发布访问地址时使用的端口
      - ATLASWORKS_PUBLIC_BASE_PORT=${ATLASWORKS_PUBLISHER_PUBLIC_BASE_PORT:-18001}
      # Nginx 静态发布对外地址；为空时按发布主机和 18080 生成
      - ATLASWORKS_NGINX_PUBLIC_BASE_URL=${ATLASWORKS_NGINX_PUBLIC_BASE_URL:-}
      # Nginx 静态发布对外端口
      - ATLASWORKS_NGINX_PUBLIC_BASE_PORT=${ATLASWORKS_NGINX_PUBLIC_BASE_PORT:-18080}
      # TiTiler 动态影像发布对外地址；为空时按发布主机和 18002 生成
      - ATLASWORKS_TITILER_PUBLIC_BASE_URL=${ATLASWORKS_TITILER_PUBLIC_BASE_URL:-}
      # TiTiler 动态影像发布对外端口
      - ATLASWORKS_TITILER_PUBLIC_BASE_PORT=${ATLASWORKS_TITILER_PUBLIC_BASE_PORT:-18002}
      # TiTiler 使用的瓦片矩阵集
      - ATLASWORKS_TITILER_TILE_MATRIX_SET=${ATLASWORKS_TITILER_TILE_MATRIX_SET:-WebMercatorQuad}
      # 容器内数据源目录，需与 volumes 的容器路径一致
      - ATLASWORKS_DATA_SOURCE_DIR=/app/dataSource
      # 容器内瓦片输出目录，需与 volumes 的容器路径一致
      - ATLASWORKS_TILES_DIR=/app/tiles
      # 容器内日志目录，需与 volumes 的容器路径一致
      - ATLASWORKS_LOG_DIR=/app/log
      # 启用数据库持久化
      - TF_DB_ENABLED=1
      # 内置数据库服务名，容器网络内固定使用 atlasworks-postgres
      - TF_DB_HOST=atlasworks-postgres
      # 容器网络内 PostgreSQL 端口，固定使用 5432
      - TF_DB_PORT=5432
      # 数据库名称
      - TF_DB_NAME=${ATLASWORKS_DB_NAME:-atlasworks}
      # 数据库用户
      - TF_DB_USER=${ATLASWORKS_DB_USER:-postgres}
      # 数据库密码
      - TF_DB_PASSWORD=${ATLASWORKS_DB_PASSWORD:-atlasworks}
      # 数据库连接超时时间，单位秒
      - TF_DB_CONNECT_TIMEOUT=${ATLASWORKS_DB_CONNECT_TIMEOUT:-3}
      # 内置数据库默认不启用 SSL
      - TF_DB_SSLMODE=disable
      # 发布服务不执行任务状态同步
      - TF_TASK_SYNC_ENABLED=0
    ports:
      - "${ATLASWORKS_PUBLISHER_HOST_PORT:-18001}:18001"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18001/api/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - "D:/TIF:/app/dataSource"
      - "D:/tiles:/app/tiles"
      - ./runtime/log:/app/log

  # 服务名：Nginx 静态发布后端，负责高性能发布已切好的瓦片目录
  atlasworks-nginx:
    image: nginx:1.27-alpine
    platform: linux/amd64
    container_name: atlasworks-nginx
    restart: unless-stopped
    # Nginx 静态发布 CPU 上限
    cpus: ${ATLASWORKS_NGINX_CPUS:-1.0}
    # Nginx 静态发布最大内存
    mem_limit: ${ATLASWORKS_NGINX_MEM_LIMIT:-512m}
    ports:
      # Nginx 静态发布对外端口
      - "${ATLASWORKS_NGINX_HOST_PORT:-18080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      # 挂载 Nginx 发布配置
      - ./deploy/nginx/atlasworks.conf:/etc/nginx/conf.d/default.conf:ro
      # 只读挂载瓦片目录，由 Nginx 直接发布 /published/*
      - "D:/tiles:/srv/atlasworks/tiles:ro"

  # 服务名：TiTiler 动态影像发布后端，负责 COG / GeoTIFF 按需出瓦片
  atlasworks-titiler:
    image: ghcr.io/developmentseed/titiler:latest
    platform: linux/amd64
    container_name: atlasworks-titiler
    restart: unless-stopped
    command: ["uvicorn", "titiler.application.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    # TiTiler CPU 上限
    cpus: ${ATLASWORKS_TITILER_CPUS:-4.0}
    # TiTiler 最大内存
    mem_limit: ${ATLASWORKS_TITILER_MEM_LIMIT:-8g}
    ports:
      # TiTiler 对外端口
      - "${ATLASWORKS_TITILER_HOST_PORT:-18002}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      # 只读挂载数据源目录，TiTiler 可直接读取 COG / GeoTIFF
      - "D:/TIF:/app/dataSource:ro"
      # 只读挂载瓦片目录，兼容后续从产物目录发布 COG
      - "D:/tiles:/app/tiles:ro"
      # 动态发布运行时缓存走 Docker volume，避免 Windows 挂载盘随机读拖慢 TiTiler
      - atlasworks-publications-cache:/app/tiles/_publications:ro

volumes:
  atlasworks-publications-cache:
