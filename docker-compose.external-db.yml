      # 发布服务容器内部监听端口
      - PORT=18001
      # 发布访问地址完整覆盖；为空时按主机、端口和请求信息自动计算
      - ATLASWORKS_PUBLIC_BASE_URL=${ATLASWORKS_PUBLISHER_PUBLIC_BASE_URL:-}
      # 生成发布访问地址时使用的主机 IP 或域名
      - ATLASWORKS_PUBLIC_BASE_HOST=${ATLASWORKS_PUBLIC_BASE_HOST:-10.168.1.113}
      # 发布访问地址解析模式，request_host 表示优先使用请求 Host
      - ATLASWORKS_PUBLIC_BASE_MODE=${ATLASWORKS_PUBLIC_BASE_MODE:-request_host}
      # 生成发布访问地址时使用的端口
      - ATLASWORKS_PUBLIC_BASE_PORT=${ATLASWORKS_PUBLISHER_PUBLIC_BASE_PORT:-18001}
      # 容器内数据源目录，需与 volumes 的容器路径一致
      - ATLASWORKS_DATA_SOURCE_DIR=/app/dataSource
      # 容器内瓦片输出目录，需与 volumes 的容器路径一致
      - ATLASWORKS_TILES_DIR=/app/tiles
      # 容器内日志目录，需与 volumes 的容器路径一致
      - ATLASWORKS_LOG_DIR=/app/log
      # 启用数据库持久化
      - TF_DB_ENABLED=1
      # 数据库主机，外部数据库版默认访问宿主机 PostgreSQL
      - TF_DB_HOST=${ATLASWORKS_DB_HOST:-host.docker.internal}
      # 数据库端口
      - TF_DB_PORT=${ATLASWORKS_DB_PORT:-5432}
      # 数据库名称
      - TF_DB_NAME=${ATLASWORKS_DB_NAME:-atlasworks}
      # 数据库用户
      - TF_DB_USER=${ATLASWORKS_DB_USER:-postgres}
      # 数据库密码
      - TF_DB_PASSWORD=${ATLASWORKS_DB_PASSWORD:-atlasworks}
      # 数据库连接超时时间，单位秒
      - TF_DB_CONNECT_TIMEOUT=${ATLASWORKS_DB_CONNECT_TIMEOUT:-3}
      # 数据库 SSL 模式，本地或内网通常使用 disable
      - TF_DB_SSLMODE=${ATLASWORKS_DB_SSLMODE:-disable}
      # 发布服务不执行任务状态同步
      - TF_TASK_SYNC_ENABLED=0
    ports:
      - "${ATLASWORKS_PUBLISHER_HOST_PORT:-18001}:18001"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18001/api/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - "D:/TIF:/app/dataSource"
      - "D:/tiles:/app/tiles"
      - ./runtime/log:/app/log
