# 外部 PostgreSQL 版：不启动数据库容器，连接宿主机或外部 PostgreSQL
#
# 常用可配置项：
# - ATLASWORKS_DB_HOST：外部 PostgreSQL 地址。Docker Desktop 访问宿主机数据库可用 host.docker.internal。
# - ATLASWORKS_DB_PORT：外部 PostgreSQL 端口，默认 5432。
# - ATLASWORKS_DB_NAME / ATLASWORKS_DB_USER / ATLASWORKS_DB_PASSWORD：数据库名称、用户、密码。
# - ATLASWORKS_HOST_PORT：API 对外端口，默认 18000。
# - ATLASWORKS_PUBLISHER_HOST_PORT：发布服务对外端口，默认 18001。
# - ATLASWORKS_PUBLIC_BASE_HOST：生成发布访问地址时使用的主机 IP 或域名。
# - ATLASWORKS_*_CPUS / ATLASWORKS_*_MEM_LIMIT：对应容器的 CPU 与内存限制。
# - volumes 下的 D:/TIF、D:/tiles、./runtime/log：宿主机数据源、瓦片输出、日志目录。
#
# 内部固定项：
# - ATLASWORKS_ROLE / ATLASWORKS_TILING_SERVICE / ATLASWORKS_WORKER_JOB_TYPES 不建议改。
# - ATLASWORKS_WORKERS 是 API Web 进程数，不是切片 Worker 容器数量。
services:

  # 服务名：AtlasWorks API 控制面
  atlasworks-api:
    # API 服务镜像名称与版本
    image: atlasworks:release-2.1.0
    platform: linux/amd64
    # 构建配置
    build:
      # 构建上下文目录
      context: .
      # 构建使用的 Dockerfile 路径
      dockerfile: deploy/docker/Dockerfile
      args:
        # 基础镜像，默认只使用 amd64/x86_64
        BASE_IMAGE: ${ATLASWORKS_BASE_IMAGE:-debian:bullseye-amd64}
        # Debian 普通软件源，内网或离线环境可替换
        APT_MIRROR: ${ATLASWORKS_APT_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian}
        # Debian security 软件源，内网或离线环境可替换
        APT_SECURITY_MIRROR: ${ATLASWORKS_APT_SECURITY_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian-security}
    # 固定容器名称
    container_name: atlasworks-api
    # 重启策略：除非手动停止，否则自动重启
    restart: unless-stopped
    # API 容器 CPU 上限
    cpus: ${ATLASWORKS_API_CPUS:-4.0}
    # API 容器最大内存
    mem_limit: ${ATLASWORKS_API_MEM_LIMIT:-8g}
    # API 容器内存软预留
    mem_reservation: ${ATLASWORKS_API_MEM_RESERVATION:-2g}
    # /dev/shm 大小，部分 geospatial 库处理大文件时会用到
    shm_size: ${ATLASWORKS_API_SHM_SIZE:-1g}
    # API 容器最大进程数
    pids_limit: ${ATLASWORKS_API_PIDS_LIMIT:-1024}
    ulimits:
      # 最大打开文件数
      nofile:
        soft: ${ATLASWORKS_API_NOFILE_SOFT:-65535}
        hard: ${ATLASWORKS_API_NOFILE_HARD:-65535}
    # 依赖服务配置
    # depends_on:
    #   # 依赖 postgres 服务
    #   atlasworks-postgres:
    #     # 依赖条件：postgres 健康后再启动 API
    #     condition: service_healthy
    # 容器环境变量配置
    environment:
      # 容器时区
      - TZ=Asia/Shanghai
      # API 监听地址
      - HOST=0.0.0.0
      # API 容器内部监听端口
      - PORT=18000
      # API Web 进程数，内部参数，不是切片 Worker 容器数量
      - ATLASWORKS_WORKERS=1
      # 每个 API Web 进程的线程数
      - ATLASWORKS_THREADS=4
      # 发布地址完整覆盖（为空则按其他规则计算）
      - ATLASWORKS_PUBLIC_BASE_URL=${ATLASWORKS_PUBLIC_BASE_URL:-}
      # 发布地址主机名/IP（默认写死，可按需覆盖）
      - ATLASWORKS_PUBLIC_BASE_HOST=${ATLASWORKS_PUBLIC_BASE_HOST:-10.168.1.113}
      # 发布地址解析模式（request_host/auto 等）
      - ATLASWORKS_PUBLIC_BASE_MODE=${ATLASWORKS_PUBLIC_BASE_MODE:-request_host}
      # 发布地址端口
      - ATLASWORKS_PUBLIC_BASE_PORT=${ATLASWORKS_PUBLIC_BASE_PORT:-18000}
      # API 文档认证用户名（可为空）
      - ATLASWORKS_DOCS_USER=${ATLASWORKS_DOCS_USER:-}
      # API 文档认证密码
      - ATLASWORKS_DOCS_PASSWORD=${ATLASWORKS_DOCS_PASSWORD:-Swsj@2025}
      # 容器内数据源目录
      - ATLASWORKS_DATA_SOURCE_DIR=/app/dataSource
      # 宿主机数据源目录（用于展示/记录）
      - ATLASWORKS_DATA_SOURCE_HOST_DIR=D:/TIF
      # 容器内瓦片目录
      - ATLASWORKS_TILES_DIR=/app/tiles
      # 宿主机瓦片目录（用于展示/记录）
      - ATLASWORKS_TILES_HOST_DIR=D:/tiles
      # 容器内日志目录
      - ATLASWORKS_LOG_DIR=/app/log
      # 宿主机日志目录（用于展示/记录）
      - ATLASWORKS_LOG_HOST_DIR=./runtime/log
      # 启用数据库持久化能力
      - TF_DB_ENABLED=1
      # 数据库主机（容器网络内建议用服务名）
      - TF_DB_HOST=${ATLASWORKS_DB_HOST:-host.docker.internal}
      # 数据库端口
      - TF_DB_PORT=${ATLASWORKS_DB_PORT:-5432}
      # 数据库名称
      - TF_DB_NAME=${ATLASWORKS_DB_NAME:-atlasworks}
      # 数据库用户
      - TF_DB_USER=${ATLASWORKS_DB_USER:-postgres}
      # 数据库密码
      - TF_DB_PASSWORD=${ATLASWORKS_DB_PASSWORD:-atlasworks}
      # 数据库连接超时（秒）
      - TF_DB_CONNECT_TIMEOUT=${ATLASWORKS_DB_CONNECT_TIMEOUT:-3}
      # 数据库 SSL 模式（本地默认 disable）
      - TF_DB_SSLMODE=${ATLASWORKS_DB_SSLMODE:-disable}
      # 启用任务状态同步线程
      - TF_TASK_SYNC_ENABLED=1
      # 任务状态同步间隔（秒）
      - TF_TASK_SYNC_INTERVAL=2
      # API 只负责入队，切片 worker 容器负责执行已迁移的任务
      - ATLASWORKS_TASK_DISPATCH=worker
    # 端口映射配置
    ports:
      # 主机端口映射到容器同端口
      - "${ATLASWORKS_HOST_PORT:-18000}:18000"
    # 健康检查配置
    healthcheck:
      # 健康检查命令
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18000/api/health', timeout=5)"]
      # 检查间隔
      interval: 15s
      # 单次检查超时
      timeout: 5s
      # 失败重试次数
      retries: 10
      # 容器启动后的宽限期
      start_period: 15s
    # 数据卷挂载配置
    volumes:
      # 挂载宿主机数据源目录到容器
      - "D:/TIF:/app/dataSource"
      # 挂载宿主机瓦片目录到容器
      - "D:/tiles:/app/tiles"
      # 挂载宿主机日志目录到容器
      - ./runtime/log:/app/log

  # 服务名：二维矢量切片 Worker，执行 MVT / GeoJSON 金字塔切片
  atlasworks-vector-worker:
    image: atlasworks:release-2.1.0
    platform: linux/amd64
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        BASE_IMAGE: ${ATLASWORKS_BASE_IMAGE:-debian:bullseye-amd64}
        APT_MIRROR: ${ATLASWORKS_APT_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian}
        APT_SECURITY_MIRROR: ${ATLASWORKS_APT_SECURITY_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian-security}
    container_name: atlasworks-vector-worker
    restart: unless-stopped
    # 二维矢量切片 Worker CPU 上限
    cpus: ${ATLASWORKS_WORKER_CPUS:-4.0}
    # 二维矢量切片 Worker 最大内存
    mem_limit: ${ATLASWORKS_WORKER_MEM_LIMIT:-8g}
    # 二维矢量切片 Worker 内存软预留
    mem_reservation: ${ATLASWORKS_WORKER_MEM_RESERVATION:-2g}
    # /dev/shm 大小，矢量大文件转换时可按需加大
    shm_size: ${ATLASWORKS_WORKER_SHM_SIZE:-1g}
    # Worker 最大进程数
    pids_limit: ${ATLASWORKS_WORKER_PIDS_LIMIT:-2048}
    ulimits:
      nofile:
        soft: ${ATLASWORKS_WORKER_NOFILE_SOFT:-65535}
        hard: ${ATLASWORKS_WORKER_NOFILE_HARD:-65535}
    depends_on:
      atlasworks-api:
        condition: service_healthy
    environment:
      # 固定为 worker 角色
      - TZ=Asia/Shanghai
      - ATLASWORKS_ROLE=worker
      # 固定为二维矢量切片服务
      - ATLASWORKS_TILING_SERVICE=vector
      # Worker 容器跳过建表，由 API 负责数据库初始化
      - ATLASWORKS_WORKER_SKIP_DB_INIT=1
      # Worker 实例 ID，仅用于任务占用与日志标识
      - ATLASWORKS_WORKER_ID=atlasworks-vector-worker-1
      # Worker 轮询数据库任务队列间隔，单位秒
      - ATLASWORKS_WORKER_POLL_INTERVAL=2
      # 该 Worker 接收的任务类型，不建议部署时修改
      - ATLASWORKS_WORKER_JOB_TYPES=mvt_tiles,geojson_tiles,vector_tiles
      # 容器内数据源目录，需与 volumes 的容器路径一致
      - ATLASWORKS_DATA_SOURCE_DIR=/app/dataSource
      # 宿主机数据源目录，仅用于页面展示和记录
      - ATLASWORKS_DATA_SOURCE_HOST_DIR=D:/TIF
      # 容器内瓦片输出目录，需与 volumes 的容器路径一致
      - ATLASWORKS_TILES_DIR=/app/tiles
      # 宿主机瓦片输出目录，仅用于页面展示和记录
      - ATLASWORKS_TILES_HOST_DIR=D:/tiles
      # 容器内日志目录，需与 volumes 的容器路径一致
      - ATLASWORKS_LOG_DIR=/app/log
      # 宿主机日志目录，仅用于页面展示和记录
      - ATLASWORKS_LOG_HOST_DIR=./runtime/log
      # 启用数据库持久化和任务队列
      - TF_DB_ENABLED=1
      # 数据库主机，外部数据库版默认访问宿主机 PostgreSQL
      - TF_DB_HOST=${ATLASWORKS_DB_HOST:-host.docker.internal}
      # 数据库端口
      - TF_DB_PORT=${ATLASWORKS_DB_PORT:-5432}
      # 数据库名称
      - TF_DB_NAME=${ATLASWORKS_DB_NAME:-atlasworks}
      # 数据库用户
      - TF_DB_USER=${ATLASWORKS_DB_USER:-postgres}
      # 数据库密码
      - TF_DB_PASSWORD=${ATLASWORKS_DB_PASSWORD:-atlasworks}
      # 数据库连接超时时间，单位秒
      - TF_DB_CONNECT_TIMEOUT=${ATLASWORKS_DB_CONNECT_TIMEOUT:-3}
      # 数据库 SSL 模式，本地或内网通常使用 disable
      - TF_DB_SSLMODE=${ATLASWORKS_DB_SSLMODE:-disable}
      # 启用任务状态同步线程
      - TF_TASK_SYNC_ENABLED=1
      # Worker 直接执行已领取任务
      - ATLASWORKS_TASK_DISPATCH=inline
    volumes:
      - "D:/TIF:/app/dataSource"
      - "D:/tiles:/app/tiles"
      - ./runtime/log:/app/log

  # 服务名：影像切片 Worker，执行 indexed/map 栅格切片队列任务
  atlasworks-raster-worker:
    image: atlasworks:release-2.1.0
