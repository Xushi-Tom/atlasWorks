<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}AtlasWorks{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/static/css/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<!-- Sidebar navigation -->
<div class="d-flex">
  <nav id="sidebar" class="d-flex flex-column p-3 text-white">
    <a href="/" class="d-flex align-items-center mb-4 text-white text-decoration-none">
      <i class="bi bi-globe2 fs-4 me-2"></i>
      <span class="fs-5 fw-semibold">AtlasWorks</span>
    </a>
    <hr class="text-white-50" />
    <ul class="nav nav-pills flex-column mb-auto">
      <li class="nav-item">
        <a href="/" class="nav-link text-white {% if request.url.path == '/' %}active{% endif %}">
          <i class="bi bi-speedometer2 me-2"></i>Dashboard
        </a>
      </li>
      <li>
        <a href="/tasks" class="nav-link text-white {% if request.url.path.startswith('/tasks') %}active{% endif %}">
          <i class="bi bi-list-task me-2"></i>Tasks
        </a>
      </li>
      <li>
        <a href="/artifacts" class="nav-link text-white {% if request.url.path.startswith('/artifacts') %}active{% endif %}">
          <i class="bi bi-archive me-2"></i>Artifacts
        </a>
      </li>
      <li>
        <a href="/publish" class="nav-link text-white {% if request.url.path.startswith('/publish') %}active{% endif %}">
          <i class="bi bi-broadcast me-2"></i>Publish
        </a>
      </li>
    </ul>
    <hr class="text-white-50" />
    <small class="text-white-50">v1.0.0</small>
  </nav>

  <!-- Main content -->
  <main class="flex-grow-1 p-4">
    {% block content %}{% endblock %}
  </main>
</div>

<script src="/static/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
