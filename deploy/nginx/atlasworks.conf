map $uri $tile_content_encoding {
    default "";
    ~*\.terrain$ "gzip";
    ~*\.pbf$ "gzip";
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, Range, Accept" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
    
    # 根据文件扩展名动态添加 Content-Encoding，如果是空字符串则 Nginx 不会添加该头
    add_header Content-Encoding $tile_content_encoding always;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /published/ {
        alias /srv/atlasworks/tiles/;
        autoindex on;
        sendfile on;
        tcp_nopush on;
        gzip_static on;
        expires 1h;

        # 补齐瓦片特有的 MIME 类型
        include /etc/nginx/mime.types;
        types {
            application/vnd.quantized-mesh terrain;
            application/vnd.mapbox-vector-tile pbf;
        }

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
